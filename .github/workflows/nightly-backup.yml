name: Nightly Automated 3rd-Party Backup

on:
  schedule:
    # Chạy tự động lúc 00:00 hàng ngày (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Thực thi sao lưu dữ liệu & Giữ thức hệ thống (Keep-Alive)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          chmod +x ./scripts/backup-to-gdrive.sh
          ./scripts/backup-to-gdrive.sh
